<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-labelledby="t d">
<title id="t">Sachin Kaythamwar — Software Engineer II, Full Stack Product Engineer</title>
<desc id="d">Animated engineering-drawing style header with the name Sachin Kaythamwar and a rotating list of focus areas.</desc>
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace}
.sans{font-family:Inter,"Segoe UI",Helvetica,Arial,sans-serif}
.frame{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 2.2s ease-out both}
.dimline{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.4s ease-out .9s both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.fade{animation:fade .9s ease-out .3s both}
.fade2{animation:fade .9s ease-out 1.6s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.rise{animation:rise .9s ease-out .5s both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.6)}}
.ph{opacity:0;animation:cycle 16s linear infinite both}
.ph1{opacity:1}
@keyframes cycle{0%{opacity:0}2%{opacity:1}23%{opacity:1}25%,100%{opacity:0}}
.cv{transform-box:fill-box;transform-origin:100% 50%;transform:scaleX(0);animation:reveal 16s infinite both}
@keyframes reveal{0%{transform:scaleX(1)}11%{transform:scaleX(0)}100%{transform:scaleX(0)}}
.ph1,.cv1{animation-delay:0s}.cv1{animation-timing-function:steps(27)}.ph2,.cv2{animation-delay:4s}.cv2{animation-timing-function:steps(26)}.ph3,.cv3{animation-delay:8s}.cv3{animation-timing-function:steps(37)}.ph4,.cv4{animation-delay:12s}.cv4{animation-timing-function:steps(32)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#1d1412" stroke-width="1"/></pattern>
</defs>

<rect width="1000" height="280" rx="14" fill="#0c0709"/>
<rect x="24" y="24" width="952" height="132" fill="url(#grid)"/>

<path class="frame" pathLength="1" fill="none" stroke="#ff5a36" stroke-width="1.5"
  d="M22 12H978A10 10 0 0 1 988 22V258A10 10 0 0 1 978 268H22A10 10 0 0 1 12 258V22A10 10 0 0 1 22 12Z"/>

<text class="mono fade" x="44" y="50" font-size="12" letter-spacing="3" fill="#9a8c85">SHEET 01 / 01  ·  PORTFOLIO</text>

<g class="fade2" transform="translate(880 92)">
  <g class="spin">
    <circle r="46" fill="none" stroke="#3a2b27" stroke-width="1.5" stroke-dasharray="4 7"/>
    <circle r="28" fill="none" stroke="#ff5a36" stroke-width="1.2" stroke-opacity=".7"/>
  </g>
  <path d="M-58 0H58M0 -58V58" stroke="#3a2b27" stroke-width="1"/>
  <circle r="3" fill="#ff5a36"/>
</g>

<text class="sans rise" x="44" y="112" font-size="56" font-weight="700" fill="#f4ece6">Sachin Kaythamwar</text>

<path class="dimline" pathLength="1" fill="none" stroke="#9a8c85" stroke-width="1"
  d="M44 128H620M44 122V134M620 122V134"/>
<text class="mono fade2" x="44" y="148" font-size="11" letter-spacing="2" fill="#9a8c85">SACHIN GANGADHAR KAYTHAMWAR</text>

<text class="mono" x="44" y="190" font-size="20" fill="#ff5a36">$</text>
<g class="ph ph1"><text class="mono" x="68" y="190" font-size="20" fill="#f4ece6" textLength="324" lengthAdjust="spacing">Full Stack Product Engineer</text><rect class="cv cv1" x="66" y="168" width="332" height="30" fill="#0c0709"/></g><g class="ph ph2"><text class="mono" x="68" y="190" font-size="20" fill="#f4ece6" textLength="312" lengthAdjust="spacing">ERP · CRM · SaaS platforms</text><rect class="cv cv2" x="66" y="168" width="320" height="30" fill="#0c0709"/></g><g class="ph ph3"><text class="mono" x="68" y="190" font-size="20" fill="#f4ece6" textLength="444" lengthAdjust="spacing">Modular Monolith. Clean Architecture.</text><rect class="cv cv3" x="66" y="168" width="452" height="30" fill="#0c0709"/></g><g class="ph ph4"><text class="mono" x="68" y="190" font-size="20" fill="#f4ece6" textLength="384" lengthAdjust="spacing">React · Next.js · Node · MongoDB</text><rect class="cv cv4" x="66" y="168" width="392" height="30" fill="#0c0709"/></g>

<g class="fade2">
  <circle class="pulse" cx="48" cy="248" r="4" fill="#3ddc84"/>
  <text class="mono" x="62" y="252" font-size="12" fill="#9a8c85">Open to SDE-2 · Product Engineer · Senior Full Stack roles</text>
</g>

<g class="fade2" font-family='ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace'>
  <rect x="690" y="196" width="286" height="60" fill="none" stroke="#3a2b27"/>
  <path d="M690 216H976M690 236H976M780 196V256" stroke="#3a2b27" fill="none"/>
  <text x="698" y="210" font-size="10" letter-spacing="1" fill="#9a8c85">DRAWN BY</text>
  <text x="788" y="210" font-size="11" fill="#f4ece6">SACHIN G. KAYTHAMWAR</text>
  <text x="698" y="230" font-size="10" letter-spacing="1" fill="#9a8c85">SITE</text>
  <text x="788" y="230" font-size="11" fill="#ff5a36">sachinkaythamwar.com</text>
  <text x="698" y="250" font-size="10" letter-spacing="1" fill="#9a8c85">REV</text>
  <text x="788" y="250" font-size="11" fill="#f4ece6">2026 · SHEET 01/01</text>
</g>
</svg>
