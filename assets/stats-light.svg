text x="526" y="262">3</text><text x="526" y="318">4</text><text x="526" y="374">5</text><text x="526" y="430">6</text><text x="526" y="486">7</text><text x="526" y="542">8</text><text x="526" y="598">9</text></g></g><text class="mono fade" x="526" y="122" font-size="11" letter-spacing="2" fill="#6e625c" style="animation-delay:0.7s">ARTICLES</text><path class="draw" pathLength="1" d="M738 56V124" stroke="#ddd0ca" style="animation-delay:0.6499999999999999s"/><rect x="764" y="56" width="18" height="2" fill="#c63d1b"/><g clip-path="url(#win)"><g class="roll r1" style="animation-delay:0.75s"><text x="764" y="94">0</text><text x="764" y="150">1</text><text x="764" y="206">2</text><text x="764" y="262">3</text><text x="764" y="318">4</text><text x="764" y="374">5</text><text x="764" y="430">6</text><text x="764" y="486">7</text><text x="764" y="542">8</text><text x="764" y="598">9</text></g></g><g clip-path="url(#win)"><g class="roll r2" style="animation-delay:0.85s"><text x="791" y="94">0</text><text x="791" y="150">1</text><text x="791" y="206">2</text><text x="791" y="262">3</text><text x="791" y="318">4</text><text x="791" y="374">5</text><text x="791" y="430">6</text><text x="791" y="486">7</text><text x="791" y="542">8</text><text x="791" y="598">9</text></g></g><text class="mono fade" x="764" y="122" font-size="11" letter-spacing="2" fill="#6e625c" style="animation-delay:0.85s">REUSABLE PATTERNS</text>
