<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 140" width="1000" height="140" role="img" aria-labelledby="t">
<title id="t">By the numbers: 3+ years shipping, 21 projects, 5 articles, 12 reusable patterns</title>
<style>
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace}
.sans{font-family:Inter,"Segoe UI",Helvetica,Arial,sans-serif}
.num{font-size:44px;font-weight:700}
.roll{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;font-size:44px;font-weight:700;fill:#1a1210;animation-duration:10s;animation-timing-function:cubic-bezier(.2,.7,.2,1);animation-iteration-count:infinite;animation-fill-mode:both}
.r3{animation-name:roll3;transform:translateY(-168px)}@keyframes roll3{0%{transform:translateY(0);opacity:0}3%{opacity:1}18%{transform:translateY(-168px)}94%{transform:translateY(-168px);opacity:1}100%{transform:translateY(-168px);opacity:0}}
.r2{animation-name:roll2;transform:translateY(-112px)}@keyframes roll2{0%{transform:translateY(0);opacity:0}3%{opacity:1}18%{transform:translateY(-112px)}94%{transform:translateY(-112px);opacity:1}100%{transform:translateY(-112px);opacity:0}}
.r1{animation-name:roll1;transform:translateY(-56px)}@keyframes roll1{0%{transform:translateY(0);opacity:0}3%{opacity:1}18%{transform:translateY(-56px)}94%{transform:translateY(-56px);opacity:1}100%{transform:translateY(-56px);opacity:0}}
.r5{animation-name:roll5;transform:translateY(-280px)}@keyframes roll5{0%{transform:translateY(0);opacity:0}3%{opacity:1}18%{transform:translateY(-280px)}94%{transform:translateY(-280px);opacity:1}100%{transform:translateY(-280px);opacity:0}}
.draw{fill:none;stroke-dasharray:1;animation:draw 1s ease-out both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.fade{animation:fade .8s ease-out both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.scan{animation:scan 10s linear infinite}
@keyframes scan{0%{transform:translateX(0);opacity:0}2%{opacity:.5}20%{opacity:.5}24%{transform:translateX(1000px);opacity:0}100%{transform:translateX(1000px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.scan{opacity:0}}
</style>
<defs>
<clipPath id="win"><rect x="0" y="54" width="1000" height="52"/></clipPath>
<linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#c63d1b" stop-opacity="0"/><stop offset="1" stop-color="#c63d1b" stop-opacity=".35"/></linearGradient>
<clipPath id="card"><rect width="1000" height="140" rx="14"/></clipPath>
</defs>
<rect width="1000" height="140" rx="14" fill="#fbf8f6"/>
<text class="mono fade" x="44" y="34" font-size="12" letter-spacing="3" fill="#6e625c">SPEC  ·  BY THE NUMBERS</text>
<g clip-path="url(#card)"><rect class="scan" x="-120" y="0" width="120" height="140" fill="url(#sg)" opacity="0"/></g>
